<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>A3 · paint chunk 경계와 레이어화</title>
<style>
  :root {
    --bg:#fbfaf8; --panel:#fff; --ink:#1a1a1a; --muted:#6b6b6b; --line:#e3e0da;
    --accent:#b4401f; --stage:#f0ede7;
    --mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#14130f; --panel:#1d1b17; --ink:#eeebe4; --muted:#9a958a;
      --line:#322e28; --accent:#e8794f; --stage:#232019;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); padding:0 16px 48px;
         font:15px/1.5 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; }
  header { padding:24px 0 14px; border-bottom:1px solid var(--line); margin-bottom:16px; }
  h1 { margin:0 0 4px; font-size:20px; }
  header p { margin:0; color:var(--muted); font-size:14px; }

  .controls { display:flex; flex-wrap:wrap; gap:8px; padding:12px; background:var(--panel);
              border:1px solid var(--line); border-radius:8px; margin-bottom:12px; }
  button { font:inherit; font-size:13px; padding:6px 11px; border-radius:6px;
           border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
  button[data-on="1"] { background:var(--accent); color:#fff; border-color:var(--accent); }

  #stage { position:relative; width:900px; height:400px; overflow:hidden;
           background:var(--stage); border:1px solid var(--line); border-radius:8px; margin-bottom:12px; }
  @media (max-width:940px) { #stage { width:100%; } }

  .b { position:absolute; border-radius:4px; font:11px/1.3 var(--mono); color:#fff;
       padding:3px 5px; overflow:hidden; }
  .plain    { background:rgba(60,110,180,.72); }
  .promoted { background:rgba(180,64,31,.72); will-change: transform; }

  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .card h2 { margin:0 0 8px; font-size:12px; text-transform:uppercase;
             letter-spacing:.06em; color:var(--muted); font-weight:600; }
  #info { font:12px/1.7 var(--mono); color:var(--muted); white-space:pre-wrap; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>A3 · paint chunk 경계와 레이어화</h1>
  <p>같은 요소 구성이라도 <b>페인트 순서</b>와 <b>겹침</b>이 달라지면 합성 레이어 수가 달라지는가.</p>
</header>

<div class="controls" id="ctl"></div>
<div id="stage"></div>

<div class="card">
  <h2>현재 시나리오</h2>
  <div id="info">—</div>
</div>

</div>

<script>
(() => {
  'use strict';
  const stage = document.getElementById('stage');
  const W = 900, H = 400;

  // ── 시나리오 정의 ────────────────────────────────────────────
  // 각 시나리오는 {kind:'plain'|'promoted', x,y,w,h} 목록을 DOM 순서대로 돌려준다.
  // DOM 순서 = 페인트 순서 (z-index 를 쓰지 않으므로).
  const PROMO = { x: 100, y: 100, w: 400, h: 200 };
  const N = 20;

  const scenarios = {
    // 대조군: 평범한 박스만. 합성 레이어가 늘 이유가 없다.
    's1-plain': () =>
      Array.from({ length: N }, (_, i) => ({ kind: 'plain', x: 20 + i * 42, y: 320, w: 80, h: 60 })),

    // 승격 박스가 '맨 나중'에 그려진다 → 평범한 박스들 위에 얹힌다.
    's2-promoted-last': () => [
      ...Array.from({ length: N }, (_, i) => ({ kind: 'plain', x: 120 + i * 14, y: 120, w: 80, h: 60 })),
      { kind: 'promoted', ...PROMO },
    ],

    // 승격 박스가 '맨 먼저' + 평범한 박스들이 그 위에 겹친다.
    's3-promoted-first-overlap': () => [
      { kind: 'promoted', ...PROMO },
      ...Array.from({ length: N }, (_, i) => ({ kind: 'plain', x: 120 + i * 14, y: 120, w: 80, h: 60 })),
    ],

    // 승격 박스가 '맨 먼저' + 평범한 박스들이 겹치지 않는다.
    's4-promoted-first-nooverlap': () => [
      { kind: 'promoted', ...PROMO },
      ...Array.from({ length: N }, (_, i) => ({ kind: 'plain', x: 20 + i * 42, y: 320, w: 80, h: 60 })),
    ],

    // 승격 10 + 평범 10 을 '번갈아' 배치. 전부 서로 겹친다.
    's5-interleaved': () =>
      Array.from({ length: 20 }, (_, i) => ({
        kind: i % 2 === 0 ? 'promoted' : 'plain',
        x: 20 + i * 30, y: 40 + i * 12, w: 220, h: 150,
      })),

    // s5 와 '완전히 같은 구성·같은 위치'. DOM 순서만 승격끼리·평범끼리 묶었다.
    's6-grouped': () => {
      const slots = Array.from({ length: 20 }, (_, i) => ({ x: 20 + i * 30, y: 40 + i * 12, w: 220, h: 150 }));
      const promoted = slots.filter((_, i) => i % 2 === 0).map(s => ({ kind: 'promoted', ...s }));
      const plain    = slots.filter((_, i) => i % 2 === 1).map(s => ({ kind: 'plain', ...s }));
      return [...promoted, ...plain];
    },
  };

  let current = null;

  function apply(name) {
    const spec = scenarios[name];
    if (!spec) throw new Error('알 수 없는 시나리오: ' + name);
    const items = spec();
    stage.textContent = '';
    const frag = document.createDocumentFragment();
    items.forEach((it, i) => {
      const el = document.createElement('div');
      el.className = 'b ' + it.kind;
      el.style.cssText = `left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px`;
      el.textContent = `${i}${it.kind === 'promoted' ? '·P' : ''}`;
      frag.appendChild(el);
    });
    stage.appendChild(frag);
    current = name;

    const promoted = items.filter(i => i.kind === 'promoted').length;
    document.getElementById('info').textContent =
      `시나리오   ${name}\n` +
      `요소       ${items.length}개 (승격 ${promoted} · 평범 ${items.length - promoted})\n` +
      `DOM 순서   ${items.map(i => i.kind === 'promoted' ? 'P' : 'd').join('')}`;
    for (const b of document.querySelectorAll('#ctl button'))
      b.dataset.on = b.dataset.s === name ? '1' : '0';
  }

  // ── 버튼 ──
  const ctl = document.getElementById('ctl');
  for (const name of Object.keys(scenarios)) {
    const b = document.createElement('button');
    b.textContent = name; b.dataset.s = name;
    b.onclick = () => apply(name);
    ctl.appendChild(b);
  }

  // ── 자동화 훅 ──
  window.__A3 = {
    setScenario: apply,
    scenarios: () => Object.keys(scenarios),
    current: () => current,
    counts: () => {
      const els = stage.querySelectorAll('.b');
      return { total: els.length, promoted: stage.querySelectorAll('.promoted').length };
    },
  };

  apply('s1-plain');
})();
</script>
</body>
</html>
